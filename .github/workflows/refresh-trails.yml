# Refresh the statewide trail snapshot from OpenStreetMap.
#
# Geofabrik rebuilds a Utah extract daily -- 161 MB, the whole state, no rate
# limit and no slot protocol. osmium reduces it to the route relations in one
# pass, and the import script reads that.
#
# This replaced a tile-by-tile Overpass crawl that could not finish. Overpass
# is built for interactive questions about small areas; asked for a whole
# state it refuses, and it refused a two-degree box and a statewide one alike
# in eight seconds flat. A scheduled job nobody watches needs the answer to
# be the same every time, which is what a static download gives.
name: Refresh trails

on:
  workflow_dispatch:
  schedule:
    # Quarterly. Trails change on the scale of years.
    - cron: "0 10 1 */3 *"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install --no-audit --no-fund

      - name: Install osmium
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq osmium-tool
          osmium --version

      - name: Download the Utah extract
        run: |
          curl -sSL --retry 3 --retry-delay 5 \
            -o utah.osm.pbf \
            https://download.geofabrik.de/north-america/us/utah-latest.osm.pbf
          ls -lh utah.osm.pbf

      - name: Reduce it to route relations
        run: |
          # Two explicit passes, because tags-filter's -R did not add the
          # referenced members here: it reported success and wrote 418
          # relations with zero ways and zero nodes between them, twice,
          # with the flag before the input file and after it.
          #
          # Pass 1 selects the relations. Pass 2 uses getid to pull those
          # relations plus every way and node they reference. Each pass is
          # checked, so whichever one is wrong says so by name.
          osmium tags-filter -o rel.osm.pbf \
            utah.osm.pbf r/route=hiking,foot,mtb,bicycle
          osmium getid --add-referenced --id-osm-file rel.osm.pbf \
            -o routes.osm.pbf utah.osm.pbf
          osmium cat -f osm -o routes.osm routes.osm.pbf
          ls -lh rel.osm.pbf routes.osm.pbf routes.osm

          # Counts, read rather than guessed. Never fatal on its own.
          osmium fileinfo -e routes.osm.pbf || true

          # A route relation with no ways has no geometry, which is the
          # failure that cost two runs. Stop here, not three steps later.
          WAYS=$(osmium fileinfo -e -g data.count.ways routes.osm.pbf)
          echo "ways: $WAYS"
          if [ "$WAYS" -lt 1 ]; then
            echo "No ways in the extract: the relations carry no geometry."
            exit 1
          fi
      - name: Build the snapshot
        run: npx tsx scripts/import-osm-trails.ts routes.osm

      - name: Commit if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- src/lib/data/osmTrails.ts; then
            echo "No change."
            exit 0
          fi
          git add src/lib/data/osmTrails.ts
          git commit -m "Refresh the statewide trail snapshot from OpenStreetMap"
          for attempt in 1 2 3; do
            git pull --rebase --autostash origin main && git push && exit 0
            echo "Push attempt $attempt lost a race; retrying."
            sleep 5
          done
          echo "Could not push after three attempts."
          exit 1
